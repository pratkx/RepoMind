spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/repomind}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format-sql=false
spring.jpa.open-in-view=false

spring.ai.openai.api-key=OPENAI_API_KEY
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.embedding.model=text-embedding-3-small

#PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

#GITHUB OAUTH
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23liGUrJM34lkf3bOz}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:70b726947b6b5df5c218119a232cbe78a0a056ed}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

